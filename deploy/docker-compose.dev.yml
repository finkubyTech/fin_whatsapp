# dev: fin_whatsapp-dev on dev-network, on host port 6109 (nginx proxies to it).
#
# Change the host port (left of the colon) or the env file here. The deploy
# workflow (.github/workflows/deploy-dev.yml) copies this file to
# /opt/apps/dev/fin_whatsapp/ on the VM and runs it. By hand on the VM:
#   IMAGE=<registry>.azurecr.io/fin_whatsapp:dev-latest docker compose -f docker-compose.dev.yml up -d
#
# Exactly one container: a WhatsApp login can only be connected from one
# place, so never scale this service.
name: fin_whatsapp-dev

services:
  fin_whatsapp:
    image: ${IMAGE:?IMAGE is set by the deploy workflow}
    container_name: fin_whatsapp-dev
    restart: always
    env_file: /opt/apps/dev/.env
    environment:
      DB_SSL: "false"                # Postgres on this server has no SSL
      PORT: 5109                     # port inside the container
    ports:
      # host (localhost only, so traffic goes through nginx) : container
      - "127.0.0.1:6109:5109"
    volumes:
      - whatsapp_media:/usr/src/app/data/media
    stop_grace_period: 20s           # time to close the WhatsApp sockets cleanly
    networks: [dev-network]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G

volumes:
  whatsapp_media:

networks:
  dev-network:
    external: true
