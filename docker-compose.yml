# Runs fin_whatsapp on its own (staging server). For the whole platform locally,
# use the fin_platform root docker-compose.yml instead.
#
#   docker network create fin-network   # once per host
#   docker compose up -d --build
services:
  fin_whatsapp:
    build: .
    image: fin_whatsapp
    container_name: fin_whatsapp
    env_file: .env
    environment:
      PORT: 5109
    ports:
      - "5109:5109"
    volumes:
      - whatsapp_media:/usr/src/app/data/media
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    networks: [fin-network]

volumes:
  whatsapp_media:

networks:
  fin-network:
    external: true
